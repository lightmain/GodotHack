name: Test Firefox and WebKit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_BUILD_ID: ${{ github.sha }}

jobs:
  browser-compat:
    name: ${{ matrix.browser }} basic flows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} basic flows
        run: npm run test:integration:compat -- --project=${{ matrix.browser }}

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.browser }}-basic-flow-results
          path: frontend/test-results/playwright-compat
          if-no-files-found: ignore
